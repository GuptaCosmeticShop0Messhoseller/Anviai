<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnviAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 16px 20px;
      border-bottom: 1px solid #ddd;
      font-size: 22px;
      font-weight: bold;
    }

    header span {
      font-size: 13px;
      color: #16a34a;
      margin-left: 8px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai {
      background: white;
      border: 1px solid #e5e7eb;
      margin-right: auto;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }
  </style>
</head>

<body>

<header>
  🤖 AnviAI <span>● Online</span>
</header>

<div id="chat">
  <div class="message ai">
    Namaste! 👋 Main AnviAI hoon.
    Aap mujhse kuch bhi pooch sakte hain.
  </div>
</div>

<div class="input-area">
  <input
    id="messageInput"
    type="text"
    placeholder="AnviAI se kuch poochiye..."
    autocomplete="off"
  >
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
